spring.application.name=AutoEscola3ESPV

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autoescola3espv?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:fiap}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-stacktrace=never

api.security.token.secret=${JWT_SECRET:12345678}

# CORS: origens autorizadas a consumir a API (separadas por virgula)
api.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}

# API externa consumida: ViaCEP
api.viacep.url=https://viacep.com.br/ws

# Documentacao automatica (Swagger UI em /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
