# Banco em memoria (H2 em modo MySQL) para os testes automatizados: nao precisa de MySQL rodando
spring.datasource.url=jdbc:h2:mem:autoescola3espv_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

api.security.token.secret=segredo-de-teste
api.security.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
api.viacep.url=https://viacep.com.br/ws
