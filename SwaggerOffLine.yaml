openapi: 3.1.0
info:
  title: Auto Escola 3ESPV
  description: |-
    API REST para gerenciamento de instruções da Auto Escola 3ESPV.
    Para acessar os endpoints protegidos, faça login em POST /login
    e informe o token retornado no botão Authorize.
  contact:
    name: Auto Escola 3ESPV
    email: autoescola@email.com.br
  license:
    name: Apache 2.0
    url: http://springdoc.org
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Instruções
  description: Agendamento e cancelamento de instruções
- name: Autenticação
  description: Geração do token JWT
- name: Instrutores
  description: CRUD de instrutores
- name: Alunos
  description: CRUD de alunos
- name: Usuários
  description: CRUD de usuários da API (somente ADMIN)
- name: CEP
  description: Consulta de endereço no serviço externo ViaCEP
paths:
  /usuario:
    get:
      tags:
      - Usuários
      summary: Listar usuários ativos
      operationId: listarUsuarios
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "login,ASC"
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDadosDetalhamentoUsuario"
      security:
      - bearer-key: []
    put:
      tags:
      - Usuários
      summary: Atualizar usuário
      operationId: atualizarUsuario
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosAtualizacaoUsuario"
        required: true
      responses:
        "404":
          description: Usuário inexistente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoUsuario"
      security:
      - bearer-key: []
    post:
      tags:
      - Usuários
      summary: Cadastrar usuário
      operationId: cadastrarUsuario
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosCadastroUsuario"
        required: true
      responses:
        "201":
          description: Usuário cadastrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoUsuario"
        "400":
          description: Dados inválidos ou login já em uso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoUsuario"
      security:
      - bearer-key: []
  /instrutor:
    get:
      tags:
      - Instrutores
      summary: Listar instrutores ativos
      operationId: listarInstrutores
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "nome,ASC"
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDadosListagemInstrutores"
      security:
      - bearer-key: []
    put:
      tags:
      - Instrutores
      summary: Atualizar instrutor
      operationId: atualizarInstrutor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosAtualizacaoInstrutor"
        required: true
      responses:
        "404":
          description: Instrutor inexistente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
      security:
      - bearer-key: []
    post:
      tags:
      - Instrutores
      summary: Cadastrar instrutor (ADMIN)
      operationId: cadastrarInstrutor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosCadastroInstrutor"
        required: true
      responses:
        "201":
          description: Instrutor cadastrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
        "403":
          description: Usuário sem perfil ADMIN
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
      security:
      - bearer-key: []
  /aluno:
    get:
      tags:
      - Alunos
      summary: Listar alunos ativos
      operationId: listarAlunos
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "nome,ASC"
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDadosListagemAlunos"
      security:
      - bearer-key: []
    put:
      tags:
      - Alunos
      summary: Atualizar aluno
      operationId: atualizarAluno
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosAtualizacaoAluno"
        required: true
      responses:
        "404":
          description: Aluno inexistente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
      security:
      - bearer-key: []
    post:
      tags:
      - Alunos
      summary: Cadastrar aluno
      operationId: cadastrarAluno
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosCadastroAluno"
        required: true
      responses:
        "201":
          description: Aluno cadastrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
      security:
      - bearer-key: []
  /login:
    post:
      tags:
      - Autenticação
      summary: Efetuar login
      description: Retorna o token JWT a ser informado no botão Authorize
      operationId: efetuarLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosLogin"
        required: true
      responses:
        "200":
          description: Login efetuado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosTokenJWT"
        "401":
          description: Credenciais inválidas
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosTokenJWT"
  /instrucao:
    get:
      tags:
      - Instruções
      summary: Listar instruções agendadas (não canceladas)
      operationId: listarInstrucoes
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "dataHora,ASC"
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDetalhamentoAgendamento"
      security:
      - bearer-key: []
    post:
      tags:
      - Instruções
      summary: Agendar instrução
      description: "Se o instrutor não for informado, um instrutor ativo e disponí\
        vel da especialidade é escolhido aleatoriamente"
      operationId: agendarInstrucao
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosAgendamento"
        required: true
      responses:
        "201":
          description: Instrução agendada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DetalhamentoAgendamento"
        "400":
          description: Dados inválidos ou regra de negócio violada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DetalhamentoAgendamento"
        "404":
          description: Aluno ou instrutor inexistente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DetalhamentoAgendamento"
      security:
      - bearer-key: []
    delete:
      tags:
      - Instruções
      summary: Cancelar instrução
      description: Exige motivo e antecedência mínima de 24 horas
      operationId: cancelarInstrucao
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosCancelamento"
        required: true
      responses:
        "204":
          description: Instrução cancelada
        "400":
          description: Dados inválidos ou regra de negócio violada
        "404":
          description: Instrução inexistente
      security:
      - bearer-key: []
  /usuario/{id}:
    get:
      tags:
      - Usuários
      summary: Detalhar usuário
      operationId: detalharUsuario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Usuário inexistente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoUsuario"
      security:
      - bearer-key: []
    delete:
      tags:
      - Usuários
      summary: Excluir (inativar) usuário
      operationId: excluirUsuario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Usuário inativado
        "404":
          description: Usuário inexistente
      security:
      - bearer-key: []
  /instrutor/{id}:
    get:
      tags:
      - Instrutores
      summary: Detalhar instrutor
      operationId: detalharInstrutor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Instrutor inexistente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoInstrutor"
      security:
      - bearer-key: []
    delete:
      tags:
      - Instrutores
      summary: Excluir (inativar) instrutor
      operationId: excluirInstrutor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Instrutor inativado
        "404":
          description: Instrutor inexistente
      security:
      - bearer-key: []
  /instrucao/{id}:
    get:
      tags:
      - Instruções
      summary: Detalhar instrução
      operationId: detalharInstrucao
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Instrução inexistente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DetalhamentoAgendamento"
      security:
      - bearer-key: []
  /health-check:
    get:
      tags:
      - Health check
      summary: Verificar se a API está no ar
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /cep/{cep}:
    get:
      tags:
      - CEP
      summary: Consultar endereço pelo CEP
      description: Consome a API pública ViaCEP (https://viacep.com.br) para preencher
        o endereço de alunos e instrutores
      operationId: consultarCep
      parameters:
      - name: cep
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Endereço encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosEndereco"
        "404":
          description: CEP inválido ou inexistente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosEndereco"
        "503":
          description: ViaCEP indisponível
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosEndereco"
      security:
      - bearer-key: []
  /aluno/{id}:
    get:
      tags:
      - Alunos
      summary: Detalhar aluno
      operationId: detalharAluno
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Aluno inexistente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DadosDetalhamentoAluno"
      security:
      - bearer-key: []
    delete:
      tags:
      - Alunos
      summary: Excluir (inativar) aluno
      operationId: excluirAluno
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Aluno inativado
        "404":
          description: Aluno inexistente
      security:
      - bearer-key: []
components:
  schemas:
    DadosAtualizacaoUsuario:
      type: object
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        senha:
          type: string
          maxLength: 2147483647
          minLength: 6
        perfil:
          type: string
          enum:
          - ADMIN
          - USER
      required:
      - id
    DadosDetalhamentoUsuario:
      type: object
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        perfil:
          type: string
          enum:
          - ADMIN
          - USER
        ativo:
          type: boolean
    DadosAtualizacaoInstrutor:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        telefone:
          type: string
        email:
          type: string
          format: email
        especialidade:
          type: string
          enum:
          - MOTOS
          - CARROS
          - VANS
          - CAMINHOES
        endereco:
          $ref: "#/components/schemas/DadosEndereco"
      required:
      - id
    DadosEndereco:
      type: object
      properties:
        logradouro:
          type: string
          minLength: 1
        numero:
          type: string
        complemento:
          type: string
        bairro:
          type: string
          minLength: 1
        cidade:
          type: string
          minLength: 1
        uf:
          type: string
          minLength: 1
          pattern: "[A-Z]{2}"
        cep:
          type: string
          minLength: 1
          pattern: "[0-9]{8}"
      required:
      - bairro
      - cep
      - cidade
      - logradouro
      - uf
    DadosDetalhamentoInstrutor:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        telefone:
          type: string
        email:
          type: string
        cnh:
          type: string
        especialidade:
          type: string
          enum:
          - MOTOS
          - CARROS
          - VANS
          - CAMINHOES
        endereco:
          $ref: "#/components/schemas/DadosEndereco"
        ativo:
          type: boolean
    DadosAtualizacaoAluno:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        telefone:
          type: string
        email:
          type: string
          format: email
        endereco:
          $ref: "#/components/schemas/DadosEndereco"
      required:
      - id
    DadosDetalhamentoAluno:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        telefone:
          type: string
        email:
          type: string
        cpf:
          type: string
        endereco:
          $ref: "#/components/schemas/DadosEndereco"
        ativo:
          type: boolean
    DadosCadastroUsuario:
      type: object
      properties:
        login:
          type: string
          minLength: 1
        senha:
          type: string
          maxLength: 2147483647
          minLength: 6
        perfil:
          type: string
          enum:
          - ADMIN
          - USER
      required:
      - login
      - perfil
      - senha
    DadosLogin:
      type: object
      properties:
        login:
          type: string
          minLength: 1
        senha:
          type: string
          minLength: 1
      required:
      - login
      - senha
    DadosTokenJWT:
      type: object
      properties:
        tokenJWT:
          type: string
    DadosCadastroInstrutor:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
        telefone:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        cnh:
          type: string
          minLength: 1
          pattern: "\\d{9,11}"
        especialidade:
          type: string
          enum:
          - MOTOS
          - CARROS
          - VANS
          - CAMINHOES
        endereco:
          $ref: "#/components/schemas/DadosEndereco"
      required:
      - cnh
      - email
      - especialidade
      - nome
      - telefone
    DadosAgendamento:
      type: object
      properties:
        idAluno:
          type: integer
          format: int64
        idInstrutor:
          type: integer
          format: int64
        especialidade:
          type: string
          enum:
          - MOTOS
          - CARROS
          - VANS
          - CAMINHOES
        dataHora:
          type: string
          format: date-time
      required:
      - dataHora
      - idAluno
    DetalhamentoAgendamento:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome_aluno:
          type: string
        nome_instrutor:
          type: string
        especialidade:
          type: string
          enum:
          - MOTOS
          - CARROS
          - VANS
          - CAMINHOES
        data_hora:
          type: string
          format: date-time
        motivo_cancelamento:
          type: string
          enum:
          - ALUNO_DESISTIU
          - INSTRUTOR_CANCELOU
          - OUTROS
    DadosCadastroAluno:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
        telefone:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        cpf:
          type: string
          minLength: 1
          pattern: "\\d{11}"
        endereco:
          $ref: "#/components/schemas/DadosEndereco"
      required:
      - cpf
      - email
      - endereco
      - nome
      - telefone
    PageDadosDetalhamentoUsuario:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/DadosDetalhamentoUsuario"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        unpaged:
          type: boolean
        offset:
          type: integer
          format: int64
        sort:
          $ref: "#/components/schemas/SortObject"
    SortObject:
      type: object
      properties:
        sorted:
          type: boolean
        unsorted:
          type: boolean
        empty:
          type: boolean
    DadosListagemInstrutores:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
        especialidade:
          type: string
          enum:
          - MOTOS
          - CARROS
          - VANS
          - CAMINHOES
    PageDadosListagemInstrutores:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/DadosListagemInstrutores"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    PageDetalhamentoAgendamento:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/DetalhamentoAgendamento"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    DadosListagemAlunos:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
        cpf:
          type: string
    PageDadosListagemAlunos:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/DadosListagemAlunos"
        number:
          type: integer
